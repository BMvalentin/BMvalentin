<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Valentín Méndez, Analista de Sistemas, Full Stack Developer y Data Analyst">
  <defs>
    <radialGradient id="glowBg" cx="82%" cy="30%" r="60%">
      <stop offset="0" stop-color="#B68CFA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B68CFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#B68CFA"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      .t { font-family: 'Arial Black','Helvetica Neue',Arial,sans-serif; font-weight: 900; font-style: italic; }
      .role { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',monospace; font-size: 20px; letter-spacing: 3px; fill: #cfcfd6; opacity: 0; animation: cycle 9s infinite; }
      .r2 { animation-delay: 3s; }
      .r3 { animation-delay: 6s; }
      @keyframes cycle { 0% {opacity:0} 4% {opacity:1} 30% {opacity:1} 34% {opacity:0} 100% {opacity:0} }
      @media (prefers-reduced-motion: reduce) { .role { animation: none; opacity: 0; } .r1 { opacity: 1; } }
    </style>
  </defs>
  <rect width="1000" height="340" rx="28" fill="#050505"/>
  <rect width="1000" height="340" rx="28" fill="url(#dots)"/>
  <rect width="1000" height="340" rx="28" fill="url(#glowBg)"/>
  <rect x="0.75" y="0.75" width="998.5" height="338.5" rx="27.5" fill="none" stroke="#1d1d22" stroke-width="1.5"/>

  <text class="t" x="64" y="136" font-size="92" fill="#FFFFFF">VALENTÍN</text>
  <text class="t" x="64" y="228" font-size="92" fill="#B68CFA" filter="url(#glow)">MÉNDEZ</text>

  <rect x="66" y="252" width="84" height="6" rx="3" fill="url(#bar)"/>

  <text class="role r1" x="66" y="304">ANALISTA DE SISTEMAS</text>
  <text class="role r2" x="66" y="304">FULL STACK DEVELOPER</text>
  <text class="role r3" x="66" y="304">DATA ANALYST</text>
</svg>
